syntax = "proto3";

package cdc.public.orders;

option go_package = "github.com/Nikhil-O1O5/kafka-go/internal/gen/orders";

// Row mirrors the orders table columns exactly.
// Debezium maps TEXT → string, TIMESTAMPTZ → string (ISO 8601).
message Row {
  string order_id  = 1;
  string item      = 2;
  string created_at = 3;
}

// Source contains metadata about where the CDC event came from.
message Source {
  string version   = 1;
  string connector = 2;
  string name      = 3;
  int64  ts_ms     = 4;
  string snapshot  = 5;
  string db        = 6;
  string sequence  = 7;
  string schema    = 8;
  string table     = 9;
  int64  txId      = 10;
  int64  lsn       = 11;
}

// Envelope is the top-level message Debezium publishes for every row change.
message Envelope {
  Row    before = 1;
  Row    after  = 2;
  Source source = 3;
  string op     = 4;
  int64  ts_ms  = 5;
}
